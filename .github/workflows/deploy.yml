name: Deploy

# The frontend deploys as a static site. There is no hosted backend, so the
# build ships without VITE_SOCKET_URL and the page runs the server's own
# simulator in the browser — labelled as such on the page itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # The gate is here rather than only on pull requests: a deployment
      # that ships a failing build because the check ran somewhere else is
      # a deployment nobody can trust.
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
